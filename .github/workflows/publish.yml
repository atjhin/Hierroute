# Publishes hierroute to PyPI using trusted publishing (no API token stored here).
#
#   PyPI:     create a GitHub release with a tag like v0.1.0 (must equal hierroute.__version__).
#   TestPyPI: Actions tab -> publish -> Run workflow.
#
# One-time setup on pypi.org / test.pypi.org: add a (pending) trusted publisher with
# owner atjhin, repository Hierroute, workflow publish.yml, environment pypi / testpypi.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(grep -Po '^__version__ = "\K[^"]+' hierroute/__init__.py)
          test "v${version}" = "${{ github.event.release.tag_name }}" || {
            echo "Tag ${{ github.event.release.tag_name }} does not match hierroute.__version__ ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
