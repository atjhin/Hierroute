# Example: the WHOI marine diatom data (Plankton-WHOI, .png images in one folder per year).
#
#   hierroute train --config configs/whoi_swin_t_mlp.yaml --data-dir /path/to/WHOI-Plankton

hierarchy: whoi_s              # or whoi_l for the 5-level lineage taxonomy

model:
  backbone: swin_t
  expert: mlp

data:
  data_dir: null
  subdirectories: ['2006', '2007', '2008', '2009', '2010', '2011', '2012', '2013', '2014']
  format: .png
  resolution: 64
  max_class_size: 6000

augment:
  background_noise: false      # the synthetic dirt is calibrated for FlowCam zooplankton images

train:
  patience: 5

out_dir: training_result/whoi
